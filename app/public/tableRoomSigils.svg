<svg xmlns="http://www.w3.org/2000/svg">
  <!-- 表の部屋（調合・工房・錬成室）と待ちの紋。紋ごとの <symbol>（id は table-sigil-<名>）を、起動時に文書の置き場へ写して <use> で引く。
       露台の紋（hubTerraceSigils.svg）と同じ作法: 藍の面（#2a3070）・月白の線（#dde3f6）・金の灯り（#e8c877）。文字は描かない。
       調合の分類五つ（gift・ally_boost・self_boost・dungeon_consumable・product）と、錬成室の釦四つ（synthesize・visit・farewell・kindle）と、錬成の仕方二つ（manual・omakase）と、待つあいだ右下で回る紋（wait）。 -->

  <!-- 贈り物: リボンを掛けた小箱。 -->
  <symbol id="table-sigil-gift" viewBox="0 0 32 32">
    <path d="M6 14 H26 V27.5 H6 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M4.5 10 H27.5 V14 H4.5 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M16 10 V27.5" fill="none" stroke="#dde3f6" stroke-width="1.2" />
    <path d="M16 10 C13 4.5 8.5 5 9.5 8 C10.2 9.8 13.5 10 16 10 C18.5 10 21.8 9.8 22.5 8 C23.5 5 19 4.5 16 10 Z" fill="none" stroke="#dde3f6" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M16 17.2 L16.73 19.07 L18.6 19.8 L16.73 20.53 L16 22.4 L15.27 20.53 L13.4 19.8 L15.27 19.07 Z" fill="#e8c877" />
  </symbol>

  <!-- 仲間強化: 肩を並べた二人と、二人の上に灯る一つの星。 -->
  <symbol id="table-sigil-ally_boost" viewBox="0 0 32 32">
    <circle cx="11" cy="14" r="3.6" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" />
    <path d="M4 28 C4 22.5 7 19.5 11 19.5 C15 19.5 18 22.5 18 28 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <circle cx="21" cy="14" r="3.6" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" />
    <path d="M14 28 C14 22.5 17 19.5 21 19.5 C25 19.5 28 22.5 28 28 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M16 2.6 L16.84 4.76 L19 5.6 L16.84 6.44 L16 8.6 L15.16 6.44 L13 5.6 L15.16 4.76 Z" fill="#e8c877" />
  </symbol>

  <!-- 自分用強化: 一人と、その胸から上へ昇る灯り。 -->
  <symbol id="table-sigil-self_boost" viewBox="0 0 32 32">
    <circle cx="16" cy="12.5" r="4.2" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" />
    <path d="M7 28.5 C7 22 11 18.5 16 18.5 C21 18.5 25 22 25 28.5 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M24.5 13 V4.5 M21.6 7.4 L24.5 4.5 L27.4 7.4" fill="none" stroke="#dde3f6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M16 21.4 L16.67 23.13 L18.4 23.8 L16.67 24.47 L16 26.2 L15.33 24.47 L13.6 23.8 L15.33 23.13 Z" fill="#e8c877" />
  </symbol>

  <!-- ダンジョン消耗品: 栓をした丸い薬瓶。 -->
  <symbol id="table-sigil-dungeon_consumable" viewBox="0 0 32 32">
    <path d="M13 5 H19 V8 H13 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M13.5 8 V12.4 C9 14 6.5 17.6 6.5 21 A9.5 7.5 0 0 0 25.5 21 C25.5 17.6 23 14 18.5 12.4 V8 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M8.6 20 C11 21.6 14 21.6 16 20.6 C18 19.6 21 19.6 23.4 20.8" fill="none" stroke="#dde3f6" stroke-width="1.0" stroke-linecap="round" />
    <path d="M17.5 22.4 L18.17 24.13 L19.9 24.8 L18.17 25.47 L17.5 27.2 L16.83 25.47 L15.1 24.8 L16.83 24.13 Z" fill="#e8c877" />
  </symbol>

  <!-- 換金品: 積んだ二枚の銀貨と、上に置いた金貨。 -->
  <symbol id="table-sigil-product" viewBox="0 0 32 32">
    <path d="M4.5 20.5 V24 C4.5 26 8.5 27.5 13.5 27.5 C18.5 27.5 22.5 26 22.5 24 V20.5" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <ellipse cx="13.5" cy="20.5" rx="9" ry="3.5" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" />
    <path d="M4.5 15.5 V19 M22.5 15.5 V19" fill="none" stroke="#dde3f6" stroke-width="1.3" />
    <ellipse cx="13.5" cy="15.5" rx="9" ry="3.5" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" />
    <ellipse cx="21.5" cy="9" rx="6" ry="6" fill="#e8c877" />
    <path d="M21.5 5.8 V12.2 M19.6 7.4 H23" fill="none" stroke="#2a3070" stroke-width="1.1" stroke-linecap="round" />
  </symbol>

  <!-- 新たに錬成する: 空の丸底の硝子器と、その口に生まれかけの星。 -->
  <symbol id="table-sigil-synthesize" viewBox="0 0 32 32">
    <path d="M13 9.5 V13.6 A9 9 0 1 0 19 13.6 V9.5 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M11.5 9.5 H20.5" fill="none" stroke="#dde3f6" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="16" cy="22" r="4.4" fill="none" stroke="#dde3f6" stroke-width="0.9" stroke-dasharray="1.4 1.6" />
    <path d="M16 1.8 L16.84 3.96 L19 4.8 L16.84 5.64 L16 7.8 L15.16 5.64 L13 4.8 L15.16 3.96 Z" fill="#e8c877" />
  </symbol>

  <!-- 会いに行く: 言葉の吹き出しと、その中に灯る星。 -->
  <symbol id="table-sigil-visit" viewBox="0 0 32 32">
    <path d="M6.5 6 H25.5 A3 3 0 0 1 28.5 9 V20 A3 3 0 0 1 25.5 23 H14 L8 28 V23 H6.5 A3 3 0 0 1 3.5 20 V9 A3 3 0 0 1 6.5 6 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M16 9.6 L17.12 12.48 L20 13.6 L17.12 14.72 L16 17.6 L14.88 14.72 L12 13.6 L14.88 12.48 Z" fill="#e8c877" />
    <path d="M9 19 H23" fill="none" stroke="#dde3f6" stroke-width="1.0" stroke-linecap="round" />
  </symbol>

  <!-- お別れ: 手向けの百合の一輪。 -->
  <symbol id="table-sigil-farewell" viewBox="0 0 32 32">
    <path d="M16 18 C11 17 7.5 12.5 8 6 C11.5 8 14 10.5 16 14 C18 10.5 20.5 8 24 6 C24.5 12.5 21 17 16 18 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M16 14 C15 10 15.2 6.5 16 3.5 C16.8 6.5 17 10 16 14" fill="#2a3070" stroke="#dde3f6" stroke-width="1.1" stroke-linejoin="round" />
    <path d="M16 18 V29 M16 24 C18.5 22 21.5 21.8 23.5 23" fill="none" stroke="#dde3f6" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="16" cy="16.2" r="1.3" fill="#e8c877" />
  </symbol>

  <!-- 錬成する: 満ちた丸底の硝子器と、器から放つ灯り。 -->
  <symbol id="table-sigil-kindle" viewBox="0 0 32 32">
    <path d="M13 8.5 V12.6 A9.5 9.5 0 1 0 19 12.6 V8.5 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M11.5 8.5 H20.5" fill="none" stroke="#dde3f6" stroke-width="1.4" stroke-linecap="round" />
    <path d="M7.6 19.6 C11 18.2 13.5 20.6 16 19.6 C18.5 18.6 21 18.2 24.4 19.6" fill="none" stroke="#dde3f6" stroke-width="1.0" stroke-linecap="round" />
    <path d="M16 18.6 L17.4 22.2 L21 23.6 L17.4 25 L16 28.6 L14.6 25 L11 23.6 L14.6 22.2 Z" fill="#e8c877" />
    <path d="M16 2 V5 M9.5 4.2 L11.2 6.6 M22.5 4.2 L20.8 6.6" fill="none" stroke="#e8c877" stroke-width="1.3" stroke-linecap="round" />
  </symbol>

  <!-- マニュアル: 自分で書き付ける羽根ペンと、ペン先の書いた一筋。 -->
  <symbol id="table-sigil-manual" viewBox="0 0 32 32">
    <path d="M26.5 3.5 C19 5 12.5 11 9.5 20.5 L11.5 22.5 C21 19.5 27 13 28.5 5.5 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M27.5 4.5 L10.5 21.5" fill="none" stroke="#dde3f6" stroke-width="1.0" stroke-linecap="round" />
    <path d="M10.5 21.5 L7 25" fill="none" stroke="#dde3f6" stroke-width="1.4" stroke-linecap="round" />
    <path d="M4 28.5 C8 27 11.5 29.5 15 28 C18 26.8 21 27.4 24 28.4" fill="none" stroke="#dde3f6" stroke-width="1.1" stroke-linecap="round" />
    <path d="M7 22.6 L7.58 24.12 L9.1 24.7 L7.58 25.28 L7 26.8 L6.42 25.28 L4.9 24.7 L6.42 24.12 Z" fill="#e8c877" />
  </symbol>

  <!-- おまかせ: 上へ開いた掌と、その上に任された星。 -->
  <symbol id="table-sigil-omakase" viewBox="0 0 32 32">
    <path d="M2.5 21 C6 20.6 8.5 21.6 11 22.6 C15 24 20 23.8 23.5 22.4 C26 21.4 27.8 19.6 29.2 17.2 C30 19.6 29.6 22.6 27.6 25 C25 28 20 29.6 14.5 29.4 C9.5 29.2 6 28 2.5 27.6 Z" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" stroke-linejoin="round" />
    <path d="M11 22.6 C11.4 20 13.6 18.6 16.6 19.2 C17.4 19.4 17.4 20.4 16.6 20.6 C15 21 14 22 13.8 23.4" fill="#2a3070" stroke="#dde3f6" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round" />
    <path d="M23.8 25.4 C25.2 24.6 26.4 23.4 27.2 22 M21 27 C22.6 26.4 24 25.6 25 24.6" fill="none" stroke="#dde3f6" stroke-width="0.9" stroke-linecap="round" />
    <path d="M18 3 L19.34 6.46 L22.8 7.8 L19.34 9.14 L18 12.6 L16.66 9.14 L13.2 7.8 L16.66 6.46 Z" fill="#e8c877" />
    <path d="M12 13 L13 14 M24 13 L23 14 M18 15.2 V16.6" fill="none" stroke="#e8c877" stroke-width="1.2" stroke-linecap="round" />
  </symbol>

  <!-- 待つあいだ: 刻みを打った天球の輪と、輪を巡る金の灯りとその尾。中の星は動かず、輪ごと回ると灯りが巡って見える。 -->
  <symbol id="table-sigil-wait" viewBox="0 0 32 32">
    <circle cx="16" cy="16" r="13.6" fill="#2a3070" stroke="#dde3f6" stroke-width="1.3" />
    <circle cx="16" cy="16" r="9.4" fill="none" stroke="#dde3f6" stroke-width="0.9" stroke-dasharray="1.4 1.6" />
    <path d="M16 3.6 V6.2 M16 25.8 V28.4 M3.6 16 H6.2 M25.8 16 H28.4" fill="none" stroke="#dde3f6" stroke-width="1.1" stroke-linecap="round" />
    <path d="M16 11.6 L17.3 14.7 L20.4 16 L17.3 17.3 L16 20.4 L14.7 17.3 L11.6 16 L14.7 14.7 Z" fill="#e8c877" />
    <path d="M18.36 2.61 A13.6 13.6 0 0 1 25.62 6.38" fill="none" stroke="#e8c877" stroke-width="1.4" stroke-linecap="round" />
    <circle cx="25.62" cy="6.38" r="2" fill="#e8c877" />
  </symbol>
</svg>
